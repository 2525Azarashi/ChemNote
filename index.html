<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- アクセシビリティ確保のためユーザーによる拡大を許可（C3）。
         ピンチによる誤リロードや遷移時の異常ズームは CSS(overscroll/touch-action) と
         App 側のビューポート正規化で制御する。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0F1620" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Chembasis">
    <link rel="manifest" href="/manifest.json">
    <!-- ===== アプリのアイコン =====================================
         ご指摘（原文）
           > アプリケーションのアイコンが横に圧縮されているので
           > 正常な比に直してください。

         ■ 原因
           アイコンの枠は OS もブラウザも必ず「正方形」なのに、
           ここで指していたのは
             ・/icons/icon-192.png  … ★ファイルが存在しなかった★
             ・/manatob_bg.png      … 1000x358（横:縦 = 2.79:1 の横長ロゴ）
             ・/favicon.ico         … 中身が 1x1 の空画像
           だった。横長の絵を正方形の枠に入れれば、当然横に潰れる。

         ■ 直し方
           ロゴの比は一切変えず、正方形のキャンバスの中央に置いて
           上下に余白を足した（写真のレターボックスと同じ）。
             python3 scripts/make-icons.py
           でいつでも作り直せる。ロゴを差し替えたら再実行するだけ。

         ■ favicon だけ絵柄が違う理由
           タブのアイコンは 16px しかなく、横長ロゴ全体を入れると
           高さ 5px の帯になって読めない。
           そこでロゴ左端の「m」（山のマーク・実測 305x305 の正方形）
           だけを切り出して使っている。
         ============================================================ -->
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" sizes="any" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png">
    
    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <title>マナトビ　化学基礎</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
